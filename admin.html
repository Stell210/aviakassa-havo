<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aviakassa_havo — Заявки</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f7fb;color:#071a35}.wrap{max-width:1200px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e2e9f2;border-radius:18px;padding:20px;box-shadow:0 8px 30px #071a3510}.login{max-width:430px;margin:10vh auto}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}input,select,textarea,button{font:inherit;padding:11px 13px;border:1px solid #d8e2ed;border-radius:10px}button{cursor:pointer;background:#071a35;color:#fff;border:0;font-weight:700}.muted{color:#718096}.table{width:100%;overflow:auto;margin-top:16px}table{border-collapse:collapse;width:100%;min-width:900px}th,td{padding:12px;border-bottom:1px solid #edf1f5;text-align:left;vertical-align:top}th{font-size:13px;color:#65758a}.status{border-radius:999px;padding:6px 10px;background:#edf4ff;display:inline-block;font-size:12px;font-weight:700}.top{margin-bottom:18px}.danger{background:#b42318}
</style></head><body><div class="wrap">
<div id="login" class="card login"><h1>Админ-панель</h1><p class="muted">Aviakassa_havo · заявки</p><input id="password" type="password" placeholder="Пароль" style="width:100%;margin:8px 0"><button id="loginBtn" style="width:100%">Войти</button><p id="loginMsg"></p></div>
<div id="panel" hidden><div class="row top"><div><h1>Заявки</h1><p class="muted">Заявки с сайта в PostgreSQL</p></div><div><button id="refresh">Обновить</button> <button id="logout" class="danger">Выйти</button></div></div>
<div class="card"><div class="row"><input id="search" placeholder="Поиск по имени, телефону, маршруту"><select id="filter"><option value="">Все статусы</option><option value="new">Новая</option><option value="in_progress">В работе</option><option value="options_sent">Варианты отправлены</option><option value="booked">Забронировано</option><option value="completed">Завершено</option><option value="cancelled">Отменено</option></select></div>
<div class="table"><table><thead><tr><th>Заявка</th><th>Клиент</th><th>Маршрут</th><th>Дата</th><th>Пассажиры</th><th>Багаж</th><th>Статус</th><th>Действие</th></tr></thead><tbody id="list"></tbody></table></div></div></div></div>
<script>
let token="",all=[];
const $=id=>document.getElementById(id);
$("loginBtn").onclick=async()=>{const r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("password").value})});const d=await r.json();if(d.ok){token=d.token;localStorage.setItem("av_admin_token",token);$("login").hidden=true;$("panel").hidden=false;load()}else $("loginMsg").textContent="Неверный пароль"};
async function load(){const r=await fetch("/api/admin/bookings",{headers:{Authorization:"Bearer "+token}});if(r.status===401){logout();return}const d=await r.json();all=d.bookings||[];render()}
function render(){const q=$("search").value.toLowerCase(),f=$("filter").value;const a=all.filter(x=>(!f||x.status===f)&&(!q||[x.name,x.phone,x.from_city,x.to_city,x.request_code].join(" ").toLowerCase().includes(q)));$("list").innerHTML=a.map(x=>`<tr><td><b>${x.request_code}</b><br><small>${new Date(x.created_at).toLocaleString()}</small></td><td>${esc(x.name)}<br>${esc(x.phone)}</td><td>${esc(x.from_city)} → ${esc(x.to_city)}</td><td>${x.departure_date||"—"}${x.return_date?"<br>↩ "+x.return_date:""}</td><td>${esc(x.passengers)}</td><td>${esc(x.baggage)}</td><td><span class="status">${esc(x.status)}</span></td><td><select onchange="setStatus(${x.id},this.value)"><option value="new">Новая</option><option value="in_progress">В работе</option><option value="options_sent">Варианты отправлены</option><option value="booked">Забронировано</option><option value="completed">Завершено</option><option value="cancelled">Отменено</option></select></td></tr>`).join("");a.forEach((x,i)=>{const s=document.querySelectorAll("#list select")[i];if(s)s.value=x.status})}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
window.setStatus=async(id,status)=>{await fetch("/api/admin/bookings",{method:"PATCH",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({id,status})});load()}
$("refresh").onclick=load;$("search").oninput=render;$("filter").onchange=render;
function logout(){localStorage.removeItem("av_admin_token");token="";$("panel").hidden=true;$("login").hidden=false}
$("logout").onclick=logout;
token=localStorage.getItem("av_admin_token")||"";if(token){$("login").hidden=true;$("panel").hidden=false;load()}
</script></body></html>
