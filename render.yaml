services:
  - type: web
    name: aviakassa-havo
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aviakassa-havo-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: AVIASALES_API_TOKEN
        sync: false
databases:
  - name: aviakassa-havo-db
    databaseName: aviakassa
    user: aviakassa
