    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aviakassa-havo-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
        sync: false
        sync: false
        sync: false
        sync: false
        sync: false
        value: GDS
databases:
  - name: aviakassa-havo-db
    databaseName: aviakassa
    user: aviakassa
