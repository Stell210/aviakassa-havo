services:
  - type: web
    name: aviakassa-havo
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aviakassa-havo-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: TRAVELPAYOUTS_API_TOKEN
        sync: false
      - key: TRAVELPORT_CLIENT_ID
        sync: false
      - key: TRAVELPORT_CLIENT_SECRET
        sync: false
      - key: TRAVELPORT_USERNAME
        sync: false
      - key: TRAVELPORT_PASSWORD
        sync: false
      - key: TRAVELPORT_PCC
        sync: false
      - key: TRAVELPORT_AUTH_URL
        value: https://auth.pp.travelport.net/oauth/token
      - key: TRAVELPORT_API_URL
        value: https://api.pp.travelport.net/11/air/catalog/search/catalogproductofferings
      - key: TRAVELPORT_CONTENT_SOURCES
        value: GDS
databases:
  - name: aviakassa-havo-db
    databaseName: aviakassa
    user: aviakassa
